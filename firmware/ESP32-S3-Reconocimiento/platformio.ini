[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ✅ FIX: Aumentar stack de cam_task (default 4096 es insuficiente para face detection)
    -DCONFIG_CAMERA_TASK_STACK_SIZE=8192

board_build.arduino.memory_type = qio_opi
; ✅ FIX: Esquema de particiones con más espacio para app
board_build.partitions = huge_app.csv

lib_deps =
    densaugeo/base64 @ ^1.4.0
    adafruit/Adafruit SSD1306 @ ^2.5.16
    adafruit/Adafruit GFX Library @ ^1.12.5
    bblanchon/ArduinoJson @ ^7.4.3
    https://github.com/eloquentarduino/EloquentEsp32cam.git